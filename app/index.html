<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Naive Math</title>

    <link rel="stylesheet" href="./style.css" media="screen" title="no title" charset="utf-8">

    <script type="text/javascript" src="https://cdn.mathjax.org/mathjax/latest/MathJax.js?config=AM_HTMLorMML-full"></script>
    <script type="text/javascript" src="./gene.js"></script>
    <script type="text/javascript" src="./app.js"></script>

</head>

<body>

    <div class="app-shell">
        <div class="card">
            <header class="app-header">
                <h1>Naive Math</h1>
                <p class="subtitle">Genetic programming evolves an expression to match a target function of <em>x</em></p>
            </header>

            <section class="equation">
                <div class="expr-box text-right" id="leftMathExpr">?</div>
                <div class="equals">=</div>
                <div class="expr-box text-left" id="rightMathExpr">?</div>
            </section>

            <section class="params">
                <div class="param param-wide">
                    <label for="targetSelect">Target</label>
                    <select id="targetSelect"></select>
                </div>
                <div class="param param-wide hidden" id="customTargetParam">
                    <label for="customTargetInput">f(x) =</label>
                    <input type="text" id="customTargetInput" value="sin(x) + x/2" spellcheck="false">
                </div>
                <div class="param domain-param">
                    <label for="xMinInput">x from</label>
                    <input type="number" id="xMinInput" value="-3.1416" step="0.1">
                </div>
                <div class="param domain-param">
                    <label for="xMaxInput">x to</label>
                    <input type="number" id="xMaxInput" value="3.1416" step="0.1">
                </div>
                <div class="param domain-param">
                    <label for="samplesInput">Samples</label>
                    <input type="number" id="samplesInput" value="20" step="1" min="2">
                </div>
                <div class="param">
                    <label for="errorPercentInput">Error %</label>
                    <input type="number" id="errorPercentInput" value="0.1" step="0.01" min="0">
                </div>
                <div class="param">
                    <label for="mutationRateInput">Mutation Rate</label>
                    <input type="number" id="mutationRateInput" value="0.2" step="0.01" min="0" max="1">
                </div>
                <div class="param">
                    <label for="generationsInput">Generations</label>
                    <input type="number" id="generationsInput" value="100" step="1" min="1">
                </div>
                <div class="param">
                    <label for="populationSizeInput">Population Size</label>
                    <input type="number" id="populationSizeInput" value="1000" step="1" min="3">
                </div>
                <div class="param">
                    <label for="seedInput">Seed</label>
                    <input type="number" id="seedInput" step="1" min="0" max="4294967295">
                </div>
            </section>

            <section class="actions">
                <button type="button" id="generateBtn" class="btn-primary">Generate</button>
                <button type="button" id="cancelBtn" class="btn-secondary hidden">Cancel</button>
            </section>

            <section class="progress hidden" id="progressRow">
                <span class="spinner" aria-hidden="true"></span>
                <span id="progressText" aria-live="polite">Preparing evolution&hellip;</span>
            </section>

            <section class="error hidden" id="errorRow"></section>

            <section class="results hidden" id="valuesRow">
                <div class="result-card text-right">
                    <span class="result-label" id="leftStatLabel">Value</span>
                    <span class="result-value" id="leftValue"></span>
                </div>
                <div class="result-card result-card-error">
                    <span class="result-label" id="errorLabel">Error</span>
                    <span class="result-value" id="errorVal"></span>
                </div>
                <div class="result-card text-left">
                    <span class="result-label" id="rightStatLabel">Value</span>
                    <span class="result-value" id="rightValue"></span>
                </div>
            </section>

            <section class="fit hidden" id="fitRow">
                <table class="fit-table">
                    <thead>
                        <tr>
                            <th>x</th>
                            <th>target</th>
                            <th>evolved</th>
                            <th>|diff|</th>
                        </tr>
                    </thead>
                    <tbody id="fitBody"></tbody>
                </table>
            </section>

            <section class="ascii-row hidden" id="asciiRow">
                <div class="ascii-text text-right hidden" id="leftAsciiText"></div>
                <button type="button" id="asciiToggleBtn" class="btn-ghost">As Text</button>
                <div class="ascii-text text-left hidden" id="rightAsciiText"></div>
            </section>
        </div>
    </div>

</body>

</html>
